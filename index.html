<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/simple-logo.png"/>
    <link rel="preload" href="/sapex-animation.mp4" as="video" type="video/mp4" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sapex Connect – Student Collaboration Platform</title>
    <meta
      name="description"
      content="Sapex Connect is a student collaboration platform with study rooms and peer academic help. Join your school community to ask questions, learn together, and support each other."
    />
    <meta name="google-site-verification" content="OBo4IwwfHA5Zs-WGbnt0ctLNGZISCCCeWO8Vep37pCI" />
    <style>
      #intro-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        background: #0A0D17;
        opacity: 1;
        transition: opacity 600ms ease;
      }
      #intro-splash.is-active {
        display: flex;
      }
      #intro-splash.is-fading {
        opacity: 0;
        pointer-events: none;
      }
      #intro-splash-video {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    </style>
  </head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SFXF7DT4WE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-SFXF7DT4WE');
  </script>
  <body>
    <div id="root"></div>
    <div id="intro-splash" role="status" aria-live="polite" aria-label="Loading Sapex">
      <video
        id="intro-splash-video"
        src="/sapex-animation.mp4"
        muted
        playsinline
        preload="auto"
      ></video>
    </div>
    <script>
      (function () {
        var splash = document.getElementById("intro-splash");
        var video = document.getElementById("intro-splash-video");
        var isHome = location.pathname === "/" || location.pathname === "";
        var prefersReduced =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (!splash || !isHome || prefersReduced) {
          if (splash) splash.remove();
          return;
        }

        document.body.style.overflow = "hidden";
        splash.classList.add("is-active");
        if (video) {
          video.playbackRate = 1;
          var playPromise = video.play();
          if (playPromise && playPromise.catch) {
            playPromise.catch(function () {});
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
